name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_os: linux
            asset_arch: x64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            asset_os: linux
            asset_arch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            asset_os: macos
            asset_arch: x64
            archive: zip
          - goos: darwin
            goarch: arm64
            asset_os: macos
            asset_arch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/sbx" .

      - name: Package assets
        env:
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          asset="sbx_${ASSET_OS}_${ASSET_ARCH}"
          mkdir -p "dist/${asset}"
          cp dist/sbx "dist/${asset}/sbx"
          if [ "${ARCHIVE}" = "tar.gz" ]; then
            tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          else
            (cd dist && zip -qr "${asset}.zip" "${asset}")
          fi

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          asset="sbx_${ASSET_OS}_${ASSET_ARCH}"
          gh release upload "${TAG_NAME}" "dist/${asset}.${ARCHIVE}" --clobber
